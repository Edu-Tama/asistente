<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1F5F5B">
<meta name="description" content="Asistente personal: tareas, agenda, notas, personas y vencimientos">
<title>Asistente</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script src="vendor/supabase.js" defer></script>
<script src="config.js" defer></script>
<script src="app.js" defer></script>
</head>
<body>
<div id="offline" class="offline" hidden>Sin conexión · estás viendo los datos guardados</div>

<!-- Pantalla de acceso -->
<section id="login" class="login" hidden>
  <form id="login-form" class="login-card">
    <h1>Asistente</h1>
    <p class="muted">Tu vida, en un solo sitio.</p>
    <label>Correo<input type="email" name="email" autocomplete="email" required></label>
    <label>Contraseña<input type="password" name="password" autocomplete="current-password" minlength="6" required></label>
    <button type="submit" class="btn primary">Entrar</button>
    <button type="button" class="btn ghost" data-action="signup">Crear cuenta</button>
    <p id="login-msg" class="muted small" role="status"></p>
  </form>
</section>

<!-- Aplicación -->
<div id="app" class="app" hidden>
  <aside class="sidebar">
    <div class="brand">Asistente</div>
    <nav id="nav-side" class="nav-side"></nav>
    <div class="sync" id="sync-state"><span class="dot"></span><span>Sincronizado</span></div>
  </aside>

  <div class="main-wrap">
    <header class="topbar">
      <h1 id="view-title">Hoy</h1>
      <button class="icon-btn" data-action="goto" data-view="buscar" aria-label="Buscar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      </button>
    </header>
    <main id="main" class="main" tabindex="-1"></main>
  </div>

  <button class="fab" data-action="nuevo" aria-label="Añadir">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
  </button>

  <nav id="nav-bottom" class="nav-bottom"></nav>
</div>

<dialog id="modal" class="modal"></dialog>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
</body>
</html>
